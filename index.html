<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--ink:#262626;--paper:#FAFAFA;--card:#FFF;--line:#DBDBDB;--muted:#8E8E8E;
  --blue:#0095F6;--red:#ED4956;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --grad:linear-gradient(45deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);}
body{font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:600px;margin:0 auto;padding:22px 18px calc(72px + env(safe-area-inset-bottom));}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:500;}
.live{display:flex;align-items:center;gap:6px;font-family:var(--sans);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:99px;background:#C7C7C7;}
.dot.on{background:#4BB543;box-shadow:0 0 0 3px rgba(75,181,67,.16);}
.dot.err{background:var(--red);}

h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.08;margin:0 0 8px;}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 24px;max-width:44ch;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 16px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  overflow:hidden;transition:border-color .18s,transform .18s,box-shadow .18s;}
.card:hover{border-color:#B9B9B9;transform:translateY(-2px);box-shadow:0 6px 18px -10px rgba(38,38,38,.3);}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.card.complete{border-color:transparent;box-shadow:0 0 0 1.5px #D62976 inset;}
.cardname{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.22;}
.cardfoot{margin-top:auto;}
.bignum{font-family:var(--sans);font-size:23px;font-weight:500;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;}
.bignum span{color:var(--muted);font-size:15px;}
.cardmeta{font-family:var(--sans);font-size:11px;color:var(--muted);
  margin-top:5px;letter-spacing:.03em;}
.track{height:3px;border-radius:99px;background:#EFEFEF;margin-top:12px;overflow:hidden;}
.fill{height:100%;border-radius:99px;background:var(--grad);transition:width .3s;}

.pickhead{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:2px 0 20px;}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.wcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;
  min-height:162px;border-radius:18px;padding:15px 16px 16px;cursor:pointer;border:0;
  text-align:left;font:inherit;overflow:hidden;transition:transform .18s,box-shadow .18s;}
.wcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
.wcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.wtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto;}
.wbrand{font-size:12px;font-weight:800;letter-spacing:.01em;}
.wchip{width:27px;height:20px;border-radius:5px;flex:none;margin-left:auto;
  background:linear-gradient(135deg,#F1D586,#C6A24A);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.wchip::after{content:"";position:absolute;}
.wname{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.18;}
.wamt{font-size:12.5px;margin-top:5px;font-variant-numeric:tabular-nums;opacity:.78;}
.wamt b{font-weight:800;opacity:1;}
@media (max-width:360px){.wname{font-size:15.5px;}}

.back{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--muted);
  cursor:pointer;margin-bottom:18px;font-weight:500;}
.back:hover{color:var(--ink);}
.weeklab{font-family:var(--sans);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 12px;}
.weeklab.first{margin-top:0;}

.daylist{display:flex;flex-direction:column;margin-bottom:6px;
  border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;}
.day{border-top:1px solid var(--line);}
.day:first-child{border-top:0;}
.dayhdr{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;
  padding:16px 16px;font:inherit;color:inherit;cursor:pointer;text-align:left;
  transition:background .15s;}
.dayhdr:hover{background:#FAFAFA;}
.dayhdr:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
.day.open .dayhdr{padding-bottom:8px;}
.dbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;
  transition:background .15s,border-color .15s;}
.day.complete .dbox{background:var(--grad);border-color:transparent;color:#fff;}
.dname{font-size:25px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;line-height:1;}
.day.complete .dname{color:#D62976;}
.dcount{margin-left:auto;font-size:14px;font-weight:700;letter-spacing:-.02em;flex:none;
  font-variant-numeric:tabular-nums;}
.dcount span{color:var(--muted);font-weight:500;}
.daybody{padding:0 16px 10px 55px;}
.dtplrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 6px;}
.dtpllab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.task{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-top:1px solid #EFEFEF;}
.tbox{width:23px;height:23px;border-radius:7px;border:2px solid #D2D2D2;flex:none;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;
  padding:0;margin-top:1px;transition:background .15s,border-color .15s;}
.tbox.on{background:var(--grad);border-color:transparent;color:#fff;}
.topen{display:block;flex:1;min-width:0;text-decoration:none;color:inherit;cursor:pointer;}
.ttext{font-size:15.5px;font-weight:600;letter-spacing:-.01em;word-break:break-all;line-height:1.3;}
.task.done .ttext{text-decoration:line-through;color:var(--muted);}
.tsub{font-size:12px;color:var(--muted);margin-top:2px;}
.tflag{font-size:11.5px;color:#C77700;margin-top:3px;font-weight:500;}
.rsel{font:inherit;font-size:11.5px;font-weight:600;border-radius:99px;border:1px solid var(--line);
  background:#fff;color:var(--muted);padding:6px 9px;cursor:pointer;flex:none;margin-top:1px;}
@media (max-width:360px){.dname{font-size:22px;}.daybody{padding-left:44px;}}

.meter{display:flex;gap:3px;margin:14px 0 22px;}
.seg{flex:1;height:6px;border-radius:99px;background:#EFEFEF;}
.seg.on{background:var(--grad);}

.tplbox{border:1px solid var(--line);border-radius:14px;background:var(--card);
  padding:14px;margin-bottom:22px;}
.tpllab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;}
.tplview{white-space:pre-wrap;word-wrap:break-word;font-size:13.5px;line-height:1.6;
  color:var(--ink);}
.tplview.loading{color:#B9B9B9;}

.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;
  display:inline-block;}
.btn:hover{background:#1877D2;}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;}
.btn.ghost:hover{background:transparent;color:var(--ink);border-color:#B9B9B9;}
.btn.big{padding:11px 18px;font-size:13px;margin-top:22px;}

.item{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;overflow:hidden;transition:opacity .2s;}
.edge{width:4px;flex:none;}
.body{flex:1;min-width:0;padding:13px 13px 11px;}
.handle{font-family:var(--sans);font-weight:500;font-size:14.5px;
  letter-spacing:-.01em;word-break:break-all;line-height:1.35;}
.dname{font-size:12.5px;color:var(--muted);margin-top:3px;}
.flag{font-size:11.5px;color:#C77700;margin-top:4px;font-weight:500;}
.acts{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap;}
.sel{font:inherit;font-size:12px;font-weight:500;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--muted);padding:8px;cursor:pointer;max-width:118px;}
.check{width:34px;height:34px;border-radius:99px;border:2px solid var(--line);background:#fff;
  cursor:pointer;color:transparent;font-size:15px;flex:none;display:flex;align-items:center;
  justify-content:center;padding:0;margin-left:auto;transition:background .15s,border-color .15s;}
.check.on{background:var(--grad);border-color:transparent;color:#fff;}
.item.done{opacity:.55;}
.item.done .handle{text-decoration:line-through;}

.tallygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.stat{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px 16px;
  min-height:118px;display:flex;flex-direction:column;justify-content:space-between;}
.statnum{font-family:var(--sans);font-size:34px;font-weight:500;
  letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;}
.statlab{font-size:13px;font-weight:600;margin-top:auto;}
.statsub{font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:4px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:right;font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 0 8px;
  border-bottom:1px solid var(--line);}
th:first-child{text-align:left;}
td{padding:10px 0;border-bottom:1px solid var(--line);text-align:right;
  font-family:var(--sans);font-variant-numeric:tabular-nums;}
td:first-child{text-align:left;font-family:var(--sans);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.chip{font-family:var(--sans);font-size:11.5px;border:1px solid var(--line);
  background:var(--card);border-radius:7px;padding:5px 8px;color:var(--ink);text-decoration:none;}
.chip:hover{border-color:#B9B9B9;}
.empty{font-size:13px;color:var(--muted);margin:0;}

.note{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);
  margin-top:28px;padding-top:14px;}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#262626;
  color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;}
#toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
@media (max-width:360px){.cardname{font-size:17px;}}
</style>

    ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, txt.length);
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(navigator.clipboard && navigator.clipboard.writeText){

function mergeRows(rows){
  if(!rows || !rows.length) return;
  rows.forEach(r => {
    status[r.handle] = {sent:r.sent, response:r.response};
    if(r.updated_at > since) since = r.updated_at;
  });
}

async function pull(all){
  try{
    const q = all ? "" : "&updated_at=gt." + encodeURIComponent(since);
    const r = await fetch(REST + "/dm_status?select=handle,sent,response,updated_at" + q, {headers:HEAD});
    if(!r.ok) throw new Error(r.status);
    mergeRows(await r.json());
    const t = await fetch(REST + "/dm_settings?key=eq.template&select=value", {headers:HEAD});
    const tv = await t.json();
    if(tv[0]) tpl = tv[0].value || FALLBACK_TPL;
    conn = "live";
  }catch(e){ conn = "off"; }
  render();
}

async function push(handle, patch){
  const cur = status[handle] || {sent:false, response:null};
  const row = {
    handle: handle,
    leader_idx: leader == null ? 0 : leader,
    sent: patch.sent !== undefined ? patch.sent : cur.sent,
    response: patch.response !== undefined ? patch.response : cur.response,
    updated_at: new Date().toISOString()
  };
  status[handle] = {sent:row.sent, response:row.response};
  render();
  try{
    const r = await fetch(REST + "/dm_status", {
      method:"POST",
      headers: Object.assign({}, HEAD, {Prefer:"resolution=merge-duplicates,return=minimal"}),
      body: JSON.stringify(row)
    });
    if(!r.ok) throw new Error(r.status);
    conn = "live";
  }catch(e){ conn = "off"; flash("Didn't save \u2014 check your signal"); }
  render();
}

      '" target="_blank" rel="noreferrer" data-open="' + esc(item.h) +
      '" title="Copy message + open DM">' +
      '<div class="ttext">@' + esc(item.h) + '</div>' +
      '<div class="tsub">' + c.label + (item.n ? " \u00b7 " + esc(item.n) : "") + '</div>' +
      (item.v ? '<div class="tflag">Handle was cut off \u2014 check it first</div>' : "") +
    '</a>' +
    '<select class="rsel" data-resp="' + esc(item.h) + '" ' + selStyle + '>' +
      '<option value="">Reply\u2026</option>' +
      RESP_ORDER.map(k => '<option value="' + k + '"' + (r === k ? " selected" : "") +
        '>' + RESP[k].label + '</option>').join("") +
    '</select>' +
  '</div>';
}

function dayBlock(di){
  const L = DATA.leaders[leader];
  const list = L.days[di], total = list.length, done = dayDone(leader, di);
  const complete = total && done === total;
  const dp = dayParts(DATA.days[di]);
  const open = di === openDay;
  let h = '<div class="day' + (complete ? " complete" : "") + (open ? " open" : "") + '">' +
    '<button class="dayhdr" data-toggle="' + di + '" aria-expanded="' + open + '">' +
      '<span class="dbox">\u2713</span>' +
      '<span class="dname">' + esc(dp.wd) + '</span>' +
      '<span class="dcount">' + done + '<span>/' + total + '</span></span>' +
    '</button>';
  if(open){
    h += '<div class="daybody">' +
      '<div class="dtplrow"><span class="dtpllab">' + esc(dp.date) + ' \u00b7 team message</span>' +
        '<button class="btn ghost" data-copytpl="1">Copy message</button></div>' +
      list.map(taskRow).join("") +
    '</div>';
  }
  return h + '</div>';
}

function viewDays(){
  const L = DATA.leaders[leader];
  if(openDay === null) openDay = -1;
  const week = off => '<div class="daylist">' +
    [0,1,2,3,4].map(k => dayBlock(off + k)).join("") + '</div>';
  return '<button class="back" data-back="pick">\u2190 Not ' + esc(L.name) + '?</button>' +
    '<div class="top"><span class="eyebrow">' + L.total + ' handles \u00b7 10 days</span>' + liveHTML() + '</div>' +
    '<h1>' + esc(L.name) + '</h1>' +
    '<p class="sub">Around 13 a day. Tap a day to open its list, then check each one off as you send.</p>' +
    '<div class="weeklab first">Week of Aug 3</div>' + week(0) +
    '<div class="weeklab">Week of Aug 10</div>' + week(5) +
    '<button class="btn ghost big" data-view="tally">See team responses \u2192</button>';
}

function viewList(){
  const L = DATA.leaders[leader], list = L.days[day], d = dayDone(leader, day);
  const rows = list.map(item => {
    const c = CAMPUS[item.c] || CAMPUS.UH;
    const isS = sent(item.h), r = respOf(item.h);
    const selStyle = r ? 'style="color:' + RESP[r].color + ';background:' + RESP[r].bg +
      ';border-color:' + RESP[r].color + '55"' : "";
    return '<div class="item' + (isS ? " done" : "") + '">' +
      '<span class="edge" style="background:' + c.color + '"></span>' +
      '<div class="body">' +
        '<div class="handle">@' + esc(item.h) + '</div>' +
        '<div class="dname">' + c.label + (item.n ? " \u00b7 " + esc(item.n) : "") + '</div>' +
        (item.v ? '<div class="flag">Handle was cut off \u2014 check it first</div>' : "") +
        '<div class="acts">' +
          '<a class="btn" href="https://ig.me/m/' + encodeURIComponent(item.h) +
            '" target="_blank" rel="noreferrer" data-open="' + esc(item.h) +
            '">Copy + open</a>' +
          '<button class="btn ghost" data-copy="' + esc(item.h) + '">Copy</button>' +
          '<select class="sel" data-resp="' + esc(item.h) + '" ' + selStyle + '>' +
            '<option value="">Reply\u2026</option>' +
            RESP_ORDER.map(k => '<option value="' + k + '"' + (r === k ? " selected" : "") +
              '>' + RESP[k].label + '</option>').join("") +
          '</select>' +
          '<button class="check' + (isS ? " on" : "") + '" data-check="' + esc(item.h) +
            '" aria-pressed="' + isS + '" aria-label="Mark sent">\u2713</button>' +
        '</div>' +
      '</div></div>';
  }).join("");

  return '<button class="back" data-back="days">\u2190 ' + esc(L.name) + '\u2019s days</button>' +
    '<div class="top"><span class="eyebrow">' + esc(DATA.days[day]) + '</span>' + liveHTML() + '</div>' +
    '<h1>' + d + ' of ' + list.length + ' sent</h1>' +
    '<div class="meter" aria-hidden="true">' +
      list.map(x => '<span class="seg' + (sent(x.h) ? " on" : "") + '"></span>').join("") +
    '</div>' +
    '<div class="tplbox"><div class="tpllab"><span class="eyebrow">Team message</span>' +
      '<button class="btn ghost" data-copytpl="1">Copy</button></div>' +
      '<div class="tplview' + (tpl ? "" : " loading") + '">' + esc(tpl || PLACEHOLDER) + '</div></div>' +
    rows +
    '<p class="note">Copy + open puts the message on your clipboard and opens the thread \u2014 long-press the message box in Instagram and hit Paste, then Send. Instagram won\u2019t let an app type into the box for you. Opening a DM marks it sent. Set the reply dropdown once they answer \u2014 it feeds the team tally. Handles from the directory screenshots were read by OCR, so if a profile doesn\u2019t load the username is probably off by a character.</p>';
}

function viewTally(){
  const per = DATA.leaders.map(l => {
    const c = {yes:0, no:0, none:0, sent:0};
    l.days.forEach(dd => dd.forEach(x => {
      if(sent(x.h)) c.sent++;
      const r = respOf(x.h);
      if(c[r] !== undefined) c[r]++;
    }));
    return Object.assign({name:l.name, total:l.total}, c);
  });
  const T = per.reduce((a,l) => ({yes:a.yes+l.yes, no:a.no+l.no, none:a.none+l.none, sent:a.sent+l.sent}),
    {yes:0,no:0,none:0,sent:0});
  const grand = DATA.leaders.reduce((s,l) => s + l.total, 0);
  const lists = {yes:[], no:[], none:[]};
  DATA.leaders.forEach(l => l.days.forEach(dd => dd.forEach(x => {
    const r = respOf(x.h);
    if(lists[r]) lists[r].push(x);
  })));

  const stat = (num, color, lab, sub) =>
    '<div class="stat"><div class="statnum"' + (color ? ' style="color:' + color + '"' : "") + '>' + num + '</div>' +
    '<div><div class="statlab">' + lab + '</div><div class="statsub">' + sub + '</div></div></div>';

  return '<button class="back" data-back="' + (leader === null ? "pick" : "days") + '">\u2190 Back</button>' +
    '<div class="top"><span class="eyebrow">Everyone \u00b7 both weeks</span>' + liveHTML() + '</div>' +
    '<h1><span class="grad">Responses</span></h1>' +
    '<p class="sub">' + T.sent + ' of ' + grand + ' DMs sent so far.</p>' +
    '<div class="tallygrid">' +
      stat(T.yes, RESP.yes.color, "Said yes", "coming / interested") +
      stat(T.no, RESP.no.color, "Said no", "not interested") +
      stat(T.none, RESP.none.color, "No reply", "marked, never answered") +
      stat(Math.max(T.sent - T.yes - T.no - T.none, 0), "", "Awaiting", "sent, not logged yet") +
    '</div>' +
    '<div class="weeklab first">By leader</div>' +
    '<table><thead><tr><th>Leader</th><th>Sent</th><th>Yes</th><th>No</th><th>No reply</th></tr></thead><tbody>' +
      per.map(l => '<tr><td>' + esc(l.name) + '</td>' +
        '<td style="color:var(--muted)">' + l.sent + '/' + l.total + '</td>' +
        '<td style="color:' + (l.yes ? RESP.yes.color : "var(--muted)") + '">' + l.yes + '</td>' +
        '<td style="color:' + (l.no ? RESP.no.color : "var(--muted)") + '">' + l.no + '</td>' +
        '<td style="color:var(--muted)">' + l.none + '</td></tr>').join("") +
    '</tbody></table>' +
    RESP_ORDER.map(k =>
      '<div class="weeklab">' + RESP[k].label + ' \u00b7 ' + lists[k].length + '</div>' +
      (lists[k].length === 0 ? '<p class="empty">Nothing logged here yet.</p>' :
        '<div class="chips">' + lists[k].map(x =>
          '<a class="chip" href="https://ig.me/m/' + encodeURIComponent(x.h) +
          '" target="_blank" rel="noreferrer" style="border-left:3px solid ' +
          (CAMPUS[x.c] || CAMPUS.UH).color + '">@' + esc(x.h) + '</a>').join("") + '</div>')
    ).join("") +
    '<p class="note">The yes list is your follow-up list \u2014 invite those people personally and add them to the event count. Everyone on the team sees this page.</p>';
}

function render(){
  const app = document.getElementById("app");
  let html;
  if(view === "tally") html = viewTally();
  else if(leader === null) html = viewPick();
  else if(day === null) html = viewDays();
  else html = viewList();
  app.innerHTML = html;
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-leader],[data-toggle],[data-view],[data-back],[data-copy],[data-open],[data-check],[data-copytpl]");
  if(!t) return;

  if(t.dataset.leader !== undefined){
    leader = Number(t.dataset.leader); day = null; view = "days"; openDay = null;
    try{ localStorage.setItem("dm:me", t.dataset.leader); }catch(err){}
    return render();
  }
  if(t.dataset.toggle !== undefined){
    const di = Number(t.dataset.toggle);
    openDay = (openDay === di ? -1 : di);
    return render();
  }
  if(t.dataset.view === "tally"){ view = "tally"; return render(); }
  if(t.dataset.back){
    if(t.dataset.back === "pick"){
      leader = null; day = null; view = "pick";
      try{ localStorage.removeItem("dm:me"); }catch(err){}
    } else { day = null; view = "days"; }
    return render();
  }
  if(t.dataset.copytpl){
    const ok = copyText(tpl || "");
    flash(ok ? "Message copied" : "Copy failed \u2014 select the text above");
    return;
  }
  if(t.dataset.copy){
    const ok = copyText(msgFor(t.dataset.copy));
    flash(ok ? "Message copied \u2014 paste it in the DM" : "Copy failed \u2014 select the text above");
    return;
  }
  if(t.dataset.open){
    copyText(msgFor(t.dataset.open));
    flash("Message copied \u2014 long-press the box and paste");
    push(t.dataset.open, {sent:true});
    return;
  }
  if(t.dataset.check){ push(t.dataset.check, {sent: !sent(t.dataset.check)}); return; }
});

document.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.resp){
    const v = e.target.value;
    push(e.target.dataset.resp, {response: v || null, sent: v ? true : sent(e.target.dataset.resp)});
  }
});

/* ---------------- boot ---------------- */
try{
  const me = localStorage.getItem("dm:me");
  if(me !== null && DATA.leaders[Number(me)]){ leader = Number(me); view = "days"; }
}catch(e){}

render();
pull(true);
setInterval(() => pull(false), 4000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) pull(false); });
</script>
</body>
</html>
